name: SonarQube Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, VidiomTM]
    timeout-minutes: 30
    concurrency:
      group: sonar-${{ github.ref }}
      cancel-in-progress: true
    env:
      SONAR_PROJECT_KEY: jonathangadeaharder_german-spanish-english-eurobert-lemmatizer
    steps:
      # Dependabot pull_request events never receive repo secrets (GitHub
      # platform behavior), so scanning here 401s. Such PRs are deferred to
      # the SonarQube (dependabot) workflow_run job with a visible notice.
      - name: Defer dependabot PRs to workflow_run job
        id: preflight
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: bash
        run: |
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "::notice::Sonar scan deferred to the 'SonarQube (dependabot)' workflow_run job: pull_request events from dependabot cannot access repo secrets."
            echo "deferred=true" >> "$GITHUB_OUTPUT"
          fi
      # Same-repo PRs are trusted collaborators, so the merge-ref copy of
      # the composite runs here: changes to it are part of what CI tests,
      # like the workflow file itself under pull_request events.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        if: steps.preflight.outputs.deferred != 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: SonarQube scan
        uses: ./.github/actions/sonar-scan
        if: steps.preflight.outputs.deferred != 'true'
        with:
          token: ${{ secrets.SONAR_TOKEN }}
          project-key: ${{ env.SONAR_PROJECT_KEY }}
  # Only dependabot-authored same-repo PRs reach this secret-scoped job; the
  # resolve step re-verifies author and head SHA. The workspace holds the PR
  # tree, so the restore step rewrites the scan action from trusted main.
  sonarqube-dependabot:
    name: SonarQube (dependabot)
    permissions:
      contents: read
      pull-requests: read
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: [self-hosted, macOS, ARM64, VidiomTM]
    timeout-minutes: 30
    concurrency:
      group: sonar-dependabot-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    env:
      SONAR_PROJECT_KEY: jonathangadeaharder_german-spanish-english-eurobert-lemmatizer
    steps:
      - name: Install jq
        shell: bash
        run: command -v jq >/dev/null || brew install jq
      - name: Resolve pull request number
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            RESP=$(curl -fsS --max-time 10 -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls")
            PR=$(echo "$RESP" | jq -r '.[0].number // empty')
            if [ -z "$PR" ]; then
              echo "::notice::No pull request found for $HEAD_SHA; nothing to scan."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          case "$PR" in
            ''|*[!0-9]*)
              echo "::error::Resolved pull request number is not numeric: '$PR'"
              exit 1
              ;;
          esac
          PR_DATA=$(curl -fsS --max-time 10 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR")
          AUTHOR=$(echo "$PR_DATA" | jq -r '.user.login // empty')
          PR_HEAD=$(echo "$PR_DATA" | jq -r '.head.sha // empty')
          if [ "$AUTHOR" != "dependabot[bot]" ]; then
            echo "::notice::PR #$PR was authored by '$AUTHOR', not dependabot; the pull_request Sonar job scans it instead."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PR_HEAD" != "$HEAD_SHA" ]; then
            echo "::notice::PR #$PR head has advanced beyond the commit CI validated; a newer scan run is in flight."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        if: steps.pr.outputs.available == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore scan action from trusted main
        if: steps.pr.outputs.available == 'true'
        shell: bash
        run: |
          git fetch --no-tags origin main
          rm -rf .github/actions/sonar-scan
          git checkout origin/main -- .github/actions/sonar-scan
      - name: SonarQube scan
        uses: ./.github/actions/sonar-scan
        if: steps.pr.outputs.available == 'true'
        with:
          token: ${{ secrets.SONAR_TOKEN }}
          project-key: ${{ env.SONAR_PROJECT_KEY }}
          reset-config: 'true'
