name: sonar-scan
description: Shared SonarQube scan steps used by both SonarQube jobs in sonar.yml. Callers check out sources before invoking.

inputs:
  token:
    description: SonarQube authentication token (pass secrets.SONAR_TOKEN).
    required: true
  project-key:
    description: SonarQube project key the scan reports to and the diagnostics query.
    required: true
  reset-config:
    description: "'true' replaces sonar-project.properties with the trusted main version."
    required: false
    default: 'false'
  scanner-opts:
    description: Base SONAR_SCANNER_OPTS value; the project key is always appended.
    required: false
    default: -Dsonar.qualitygate.wait=true
  sonar-host-url:
    description: SonarQube base URL used for the readiness wait, scan and API calls.
    required: false
    default: http://127.0.0.1:9001

runs:
  using: composite
  steps:
    - name: Reset scanner config to trusted main
      if: ${{ inputs.reset-config == 'true' }}
      shell: bash
      run: |
        git fetch --no-tags origin main
        git show origin/main:sonar-project.properties > sonar-project.properties
    - name: Install jq
      shell: bash
      run: brew install jq || command -v jq >/dev/null
    - name: Wait for SonarQube
      shell: bash
      env:
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
      run: |
        for i in $(seq 1 36); do
          STATUS=$(curl -sf --max-time 2 "$SONAR_HOST_URL/api/system/status" \
            | jq -r '.status' || true)
          echo "Sonar status: ${STATUS:-unreachable} ($i/36)"
          if [ "$STATUS" = "UP" ]; then
            exit 0
          fi
          sleep 5
        done
        echo "::error::SonarQube at $SONAR_HOST_URL never became UP"
        exit 1
    - name: SonarQube Scan
      id: scan
      uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602  # nosemgrep
      env:
        SONAR_TOKEN: ${{ inputs.token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        SONAR_SCANNER_OPTS: ${{ inputs.scanner-opts }} -Dsonar.projectKey=${{ inputs.project-key }}
    - name: Print new-code issues
      if: ${{ !cancelled() }}
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        SONAR_PROJECT_KEY: ${{ inputs.project-key }}
      run: |
        AUTH="Authorization: Bearer $SONAR_TOKEN"
        curl -fsS --max-time 10 -H "$AUTH" \
          "$SONAR_HOST_URL/api/issues/search?componentKeys=$SONAR_PROJECT_KEY&inNewCodePeriod=true&resolved=false&ps=100" \
          | jq -r '.issues[] | "ISSUE \(.severity) \(.rule) \(.component):\(.line // 0) \(.message)"' || true
    - name: Enforce quality gate
      if: ${{ steps.scan.outcome == 'success' }}
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        SONAR_PROJECT_KEY: ${{ inputs.project-key }}
      run: |
        AUTH="Authorization: Bearer $SONAR_TOKEN"
        GATE=$(curl -fsS --max-time 10 -H "$AUTH" \
          "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY")
        echo "$GATE" | jq '.projectStatus.conditions[] | select(.status=="ERROR")' || true
        GATE_STATUS=$(echo "$GATE" | jq -r '.projectStatus.status // "UNKNOWN"')
        echo "Gate status: $GATE_STATUS"
        if [ "$GATE_STATUS" != "OK" ]; then
          echo "::error::SonarQube quality gate is $GATE_STATUS"
          exit 1
        fi
